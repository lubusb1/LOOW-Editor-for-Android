# ---------------------------------------------------------------------------
# 项目级 Gradle 配置
#
# 分两组：
#   1. 项目必须的（AndroidX 开关、中文路径、内存与编码）
#   2. 受限环境（沙箱 / 容器）的兼容开关 —— 普通环境下可以删掉，构建更快
# ---------------------------------------------------------------------------

# 项目零第三方运行时依赖（仅测试用到 junit / org.json），
# 这个开关保留为 true 只是避免 AGP 在部分版本上给出提示。
android.useAndroidX=true
# 每个模块只生成自己的 R 类：减少内存占用、加快编译
android.nonTransitiveRClass=true

# 工程路径含中文时 AGP 默认拒绝构建（本项目路径为 D:\deepseek项目\壁纸CODE）。
# 已实测 aapt2 / kotlinc / d8 在 UTF-8 路径下工作正常，因此显式跳过该检查。
android.overridePathCheck=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 受限环境兼容开关（在沙箱 / 容器里构建才需要；本地普通环境建议注释掉以获得增量编译）
# ---------------------------------------------------------------------------

# Gradle 的原生文件监视在受限环境会失败："Couldn't open current thread, error = 5"
org.gradle.vfs.watch=false

# Kotlin 编译走进程内策略，避免额外 fork 守护进程
kotlin.compiler.execution.strategy=in-process

# 增量编译的 .alive 标记文件在受限环境会被拒（AccessDenied），关掉更稳
kotlin.incremental=false
